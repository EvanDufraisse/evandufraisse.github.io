<meta charset="utf-8">
<div id="query-key-value-attention">
  <style>
    #query-key-value-attention {
      width: 100%;
      color: #17324d;
      background: transparent;
      --qkv-navy: #17324d;
      --qkv-blue: #4d74f4;
      --qkv-blue-soft: #e9eefc;
      --qkv-coral: #ff876a;
      --qkv-coral-soft: #fff0e5;
      --qkv-green: #29b879;
      --qkv-green-soft: #ddf3ee;
      --qkv-purple-soft: #eee7ff;
      --qkv-sky-soft: #e5f4fa;
      --qkv-panel: #f4f8fc;
      --qkv-border: #ccdceb;
      --qkv-muted: #70849a;
      --qkv-vector: #a5bdd1;
    }

    #query-key-value-attention .qkv-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    #query-key-value-attention text {
      font-family: Arial, Helvetica, sans-serif;
    }

    #query-key-value-attention .qkv-section {
      font-size: 18px;
      font-weight: 500;
      fill: var(--qkv-navy);
    }

    #query-key-value-attention .qkv-sub {
      font-size: 14px;
      font-weight: 400;
      fill: var(--qkv-muted);
    }

    #query-key-value-attention .qkv-small {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .65px;
      fill: var(--qkv-muted);
    }

    #query-key-value-attention .qkv-token {
      font-size: 16px;
      font-weight: 500;
      fill: var(--qkv-navy);
    }

    #query-key-value-attention .qkv-symbol {
      font-size: 18px;
      font-weight: 500;
      fill: var(--qkv-navy);
    }

    #query-key-value-attention .qkv-layer {
      fill: var(--qkv-panel);
      stroke: var(--qkv-border);
      stroke-width: 2;
    }

    #query-key-value-attention .qkv-stage {
      opacity: .08;
      transition: opacity .3s ease;
    }

    #query-key-value-attention .qkv-stage.is-visible {
      opacity: 1;
    }

    #query-key-value-attention .qkv-stage.is-complete {
      opacity: .18;
    }

    #query-key-value-attention .qkv-focus-card {
      transition: fill .25s ease, stroke .25s ease, stroke-width .25s ease;
    }

    #query-key-value-attention .qkv-focus-card.is-active {
      fill: var(--qkv-coral-soft);
      stroke: var(--qkv-coral);
      stroke-width: 2.5;
    }

    #query-key-value-attention .qkv-key {
      fill: var(--qkv-blue-soft);
      stroke: var(--qkv-blue);
      stroke-width: 1.7;
    }

    #query-key-value-attention .qkv-value {
      fill: var(--qkv-green-soft);
      stroke: var(--qkv-green);
      stroke-width: 1.7;
    }

    #query-key-value-attention .qkv-query {
      fill: var(--qkv-coral-soft);
      stroke: var(--qkv-coral);
      stroke-width: 2.2;
    }

    #query-key-value-attention .qkv-match-path {
      fill: none;
      stroke: var(--qkv-coral);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 8 7;
      animation: qkv-draw .75s ease forwards;
    }

    #query-key-value-attention .qkv-value-path {
      fill: none;
      stroke: var(--qkv-green);
      stroke-linecap: round;
      stroke-dasharray: 9 7;
      animation: qkv-draw .8s ease forwards;
    }

    #query-key-value-attention .qkv-output {
      opacity: .08;
      transition: opacity .3s ease;
    }

    #query-key-value-attention .qkv-output.is-visible {
      opacity: 1;
    }

    #query-key-value-attention .qkv-output-card {
      transform-box: fill-box;
      transform-origin: center;
      transform: scale(.84);
      transition: transform .32s ease, fill .25s ease, stroke .25s ease;
    }

    #query-key-value-attention .qkv-output.is-visible .qkv-output-card {
      transform: scale(1);
    }

    #query-key-value-attention .qkv-controls {
      justify-content: center;
      margin-top: .5rem;
    }

    @keyframes qkv-draw {
      from { stroke-dashoffset: 65; }
      to { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      #query-key-value-attention .qkv-stage,
      #query-key-value-attention .qkv-focus-card,
      #query-key-value-attention .qkv-output,
      #query-key-value-attention .qkv-output-card {
        transition: none;
      }

      #query-key-value-attention .qkv-match-path,
      #query-key-value-attention .qkv-value-path {
        animation: none;
      }
    }
  </style>

  <div class="viz-row qkv-controls">
    <button id="qkv-previous" class="btn" type="button">Previous</button>

    <button id="qkv-next" class="btn btn-primary" type="button">Next</button>

  </div>

  <script>
    (function () {
      const root = document.getElementById("query-key-value-attention");
      if (!root || root.dataset.ready === "true") return;
      root.dataset.ready = "true";

      const captions = [
        "1 - BUILD TOKEN EMBEDDINGS",
        "2 - CREATE KEYS, VALUES AND ONE QUERY",
        "3 - MATCH THE QUERY WITH EVERY KEY",
        "4 - COMBINE VALUES INTO THE NEW REPRESENTATION"
      ];
      const projectionStage = root.querySelector("#qkv-projection-stage");
      const matchStage = root.querySelector("#qkv-match-stage");
      const valueStage = root.querySelector("#qkv-value-stage");
      const output = root.querySelector("#qkv-output");
      const outputArrow = root.querySelector("#qkv-output-arrow");
      const caption = root.querySelector("#qkv-step-caption");
      const previous = root.querySelector("#qkv-previous");
      const next = root.querySelector("#qkv-next");
      const stepLabel = root.querySelector("#qkv-step");
      const live = root.querySelector("#qkv-live");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let currentStep = 0;
      let outputTimer;

      function replayPaths(group) {
        group.querySelectorAll(".qkv-match-path, .qkv-value-path").forEach(function (path) {
          path.style.animation = "none";
          path.getBoundingClientRect();
          path.style.animation = "";
        });
      }

      function setStep(step) {
        window.clearTimeout(outputTimer);

        projectionStage.classList.toggle("is-visible", step >= 1);
        matchStage.classList.toggle("is-visible", step === 2);
        matchStage.classList.toggle("is-complete", step > 2);
        valueStage.classList.toggle("is-visible", step >= 3);
        output.classList.remove("is-visible");
        outputArrow.classList.remove("is-visible");

        if (step === 2) replayPaths(matchStage);
        if (step === 3) replayPaths(valueStage);

        caption.textContent = captions[step];
        stepLabel.textContent = "Step " + (step + 1) + " of 4";
        live.textContent = captions[step];
        previous.disabled = step === 0;
        next.disabled = step === captions.length - 1;

        if (step === 3) {
          outputTimer = window.setTimeout(function () {
            output.classList.add("is-visible");
            outputArrow.classList.add("is-visible");
            live.textContent = captions[step] + ". The new representation of sat is produced.";
          }, reducedMotion ? 0 : 700);
        }
      }

      previous.addEventListener("click", function () {
        currentStep = Math.max(0, currentStep - 1);
        setStep(currentStep);
      });

      next.addEventListener("click", function () {
        currentStep = Math.min(captions.length - 1, currentStep + 1);
        setStep(currentStep);
      });

      setStep(currentStep);
    }());
  </script>
</div>

<script id="pptx-animation-fit">
(function () {
  "use strict";
  var body = document.body;
  var root = document.documentElement;
  function exposeScrollableContent() {
    Array.prototype.forEach.call(document.querySelectorAll("body *"), function (element) {
      if (element.scrollWidth > element.clientWidth + 1 ||
          element.scrollHeight > element.clientHeight + 1) {
        element.style.setProperty("overflow", "visible", "important");
        element.style.setProperty("overflow-x", "visible", "important");
        element.style.setProperty("overflow-y", "visible", "important");
      }
    });
  }
  function fitAnimation() {
    body.style.transform = "none";
    body.style.removeProperty("width");
    body.style.removeProperty("height");
    body.style.removeProperty("position");
    body.style.removeProperty("left");
    body.style.removeProperty("top");
    root.style.setProperty("overflow", "hidden", "important");
    body.style.setProperty("overflow", "visible", "important");
    exposeScrollableContent();
    window.requestAnimationFrame(function () {
      var width = Math.max(body.scrollWidth, body.offsetWidth, root.scrollWidth, root.clientWidth);
      var height = Math.max(body.scrollHeight, body.offsetHeight, root.scrollHeight, root.clientHeight);
      var scale = Math.min(window.innerWidth / width, window.innerHeight / height);
      body.style.margin = "0";
      body.style.transformOrigin = "top left";
      body.style.width = width + "px";
      body.style.height = height + "px";
      body.style.position = "absolute";
      body.style.left = Math.max(0, (window.innerWidth - width * scale) / 2) + "px";
      body.style.top = Math.max(0, (window.innerHeight - height * scale) / 2) + "px";
      body.style.transform = "scale(" + scale + ")";
      var autoButton = body.querySelector("#auto");
      if (autoButton && !autoButton.dataset.pptxAutoplayStarted) {
        autoButton.dataset.pptxAutoplayStarted = "true";
        autoButton.click();
      }
    });
  }
  if (document.readyState === "complete") fitAnimation();
  else window.addEventListener("load", fitAnimation, { once: true });
  window.addEventListener("resize", fitAnimation);
}());
</script>
