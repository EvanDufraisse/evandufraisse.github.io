<meta charset="utf-8">
<div id="attention-flow-animation">
  <style>
    #attention-flow-animation {
      width: 100%;
      color: #17324d;
      background: transparent;
      --af-navy: #17324d;
      --af-blue: #4d74f4;
      --af-blue-soft: #e9eefc;
      --af-coral: #ff876a;
      --af-coral-soft: #fff0e5;
      --af-green-soft: #ddf3ee;
      --af-purple-soft: #eee7ff;
      --af-sky-soft: #e5f4fa;
      --af-panel: #f4f8fc;
      --af-border: #ccdceb;
      --af-muted: #70849a;
      --af-vector: #a5bdd1;
    }

    #attention-flow-animation .af-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    #attention-flow-animation text {
      font-family: Arial, Helvetica, sans-serif;
    }

    #attention-flow-animation .af-section {
      font-size: 18px;
      font-weight: 500;
      fill: var(--af-navy);
    }

    #attention-flow-animation .af-sub {
      font-size: 14px;
      font-weight: 400;
      fill: var(--af-muted);
    }

    #attention-flow-animation .af-small {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .7px;
      fill: var(--af-muted);
    }

    #attention-flow-animation .af-token-text {
      font-size: 16px;
      font-weight: 500;
      fill: var(--af-navy);
    }

    #attention-flow-animation .af-layer {
      fill: var(--af-panel);
      stroke: var(--af-border);
      stroke-width: 2;
    }

    #attention-flow-animation .af-token-card,
    #attention-flow-animation .af-vector-card {
      transition: opacity .28s ease, stroke .28s ease, stroke-width .28s ease, fill .28s ease;
    }

    #attention-flow-animation .af-token-card.is-active,
    #attention-flow-animation .af-vector-card.is-active {
      fill: var(--af-coral-soft);
      stroke: var(--af-coral);
      stroke-width: 2.5;
      opacity: 1;
    }

    #attention-flow-animation .af-output {
      opacity: .12;
      transition: opacity .32s ease;
    }

    #attention-flow-animation .af-output.is-generated {
      opacity: 1;
    }

    #attention-flow-animation .af-output-card {
      transform-box: fill-box;
      transform-origin: center;
      transform: scale(.82);
      transition: transform .32s ease, fill .28s ease, stroke .28s ease;
    }

    #attention-flow-animation .af-output.is-generated .af-output-card {
      transform: scale(1);
    }

    #attention-flow-animation .af-output.is-active .af-output-card {
      fill: var(--af-coral-soft);
      stroke: var(--af-coral);
      stroke-width: 2.5;
    }

    #attention-flow-animation .af-output-arrow {
      opacity: .15;
      transition: opacity .28s ease, stroke .28s ease;
    }

    #attention-flow-animation .af-output-arrow.is-generated {
      opacity: .75;
    }

    #attention-flow-animation .af-output-arrow.is-active {
      opacity: 1;
      stroke: var(--af-coral);
      marker-end: url(#af-arrow-coral);
    }

    #attention-flow-animation .af-link-group {
      opacity: 0;
      transition: opacity .24s ease;
    }

    #attention-flow-animation .af-link-group.is-active {
      opacity: 1;
    }

    #attention-flow-animation .af-link {
      fill: none;
      stroke: var(--af-blue);
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-dasharray: 8 7;
      animation: af-draw-link .75s ease forwards;
    }

    #attention-flow-animation .af-link-group.is-active .af-link {
      stroke-dasharray: 8 7;
    }

    #attention-flow-animation .af-current-pill {
      fill: var(--af-coral-soft);
      stroke: var(--af-coral);
      stroke-width: 1.5;
    }

    #attention-flow-animation .af-status-main {
      font-size: 17px;
      font-weight: 500;
      fill: var(--af-navy);
    }

    #attention-flow-animation .af-status-ops {
      font-size: 24px;
      font-weight: 500;
      fill: var(--af-coral);
    }

    #attention-flow-animation .af-controls {
      justify-content: center;
      margin-top: .5rem;
    }

    @keyframes af-draw-link {
      from { stroke-dashoffset: 55; }
      to { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      #attention-flow-animation .af-token-card,
      #attention-flow-animation .af-vector-card,
      #attention-flow-animation .af-output,
      #attention-flow-animation .af-output-arrow,
      #attention-flow-animation .af-link-group {
        transition: none;
      }

      #attention-flow-animation .af-link {
        animation: none;
      }
    }
  </style>

  <div class="viz-row af-controls">
    <button id="af-previous" class="btn" type="button">Previous token</button>

    <button id="af-next" class="btn btn-primary" type="button">Next token</button>

  <script>
    (function () {
      const root = document.getElementById("attention-flow-animation");
      if (!root || root.dataset.ready === "true") return;
      root.dataset.ready = "true";

      const tokenNames = ["The", "cat", "sat", "on"];
      const activeNodes = Array.from(root.querySelectorAll("[data-active-token]"));
      const outputNodes = Array.from(root.querySelectorAll("[data-output-index]"));
      const outputArrows = Array.from(root.querySelectorAll("[data-output-arrow]"));
      const linkGroups = Array.from(root.querySelectorAll("[data-link-step]"));
      const statusMain = root.querySelector("#af-status-main");
      const statusOps = root.querySelector("#af-status-ops");
      const live = root.querySelector("#af-live");
      const previous = root.querySelector("#af-previous");
      const next = root.querySelector("#af-next");
      const stepLabel = root.querySelector("#af-step");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let currentStep = 0;
      let revealTimer;

      function setStep(step) {
        window.clearTimeout(revealTimer);

        activeNodes.forEach(function (node) {
          const index = Number(node.getAttribute("data-active-token"));
          node.classList.toggle("is-active", index === step);
        });

        outputNodes.forEach(function (node) {
          const index = Number(node.getAttribute("data-output-index"));
          node.classList.toggle("is-generated", index < step);
          node.classList.toggle("is-active", index === step);
        });

        outputArrows.forEach(function (node) {
          const index = Number(node.getAttribute("data-output-arrow"));
          node.classList.toggle("is-generated", index < step);
          node.classList.toggle("is-active", index === step);
        });

        linkGroups.forEach(function (node) {
          const index = Number(node.getAttribute("data-link-step"));
          node.classList.toggle("is-active", index === step);
          if (index === step) {
            node.querySelectorAll(".af-link").forEach(function (path) {
              path.style.animation = "none";
              path.getBoundingClientRect();
              path.style.animation = "";
            });
          }
        });

        const previousCount = step;
        const operationSuffix = previousCount === 1 ? "operation" : "operations";
        const tokenSuffix = previousCount === 1 ? "token" : "tokens";
        const mainMessage = "“" + tokenNames[step] + "” attends to " + previousCount + " " + tokenSuffix;
        const operationsMessage = previousCount + " " + operationSuffix;
        const message = mainMessage + ". " + operationsMessage;
        statusMain.textContent = mainMessage;
        statusOps.textContent = operationsMessage;
        live.textContent = message;
        stepLabel.textContent = "Token " + (step + 1) + " of 4";
        previous.disabled = step === 0;
        next.disabled = step === tokenNames.length - 1;

        revealTimer = window.setTimeout(function () {
          const currentOutput = outputNodes.find(function (node) {
            return Number(node.getAttribute("data-output-index")) === step;
          });
          const currentArrow = outputArrows.find(function (node) {
            return Number(node.getAttribute("data-output-arrow")) === step;
          });
          currentOutput.classList.add("is-generated");
          currentArrow.classList.add("is-generated");
          live.textContent = message + ". The output representation is generated.";
        }, reducedMotion ? 0 : 620);
      }

      previous.addEventListener("click", function () {
        currentStep = Math.max(0, currentStep - 1);
        setStep(currentStep);
      });

      next.addEventListener("click", function () {
        currentStep = Math.min(tokenNames.length - 1, currentStep + 1);
        setStep(currentStep);
      });

      setStep(currentStep);
    }());
  </script>

<script id="pptx-animation-fit">
(function () {
  "use strict";
  var body = document.body;
  var root = document.documentElement;
  function exposeScrollableContent() {
    Array.prototype.forEach.call(document.querySelectorAll("body *"), function (element) {
      if (element.scrollWidth > element.clientWidth + 1 ||
          element.scrollHeight > element.clientHeight + 1) {
        element.style.setProperty("overflow", "visible", "important");
        element.style.setProperty("overflow-x", "visible", "important");
        element.style.setProperty("overflow-y", "visible", "important");
      }
    });
  }
  function fitAnimation() {
    body.style.transform = "none";
    body.style.removeProperty("width");
    body.style.removeProperty("height");
    body.style.removeProperty("position");
    body.style.removeProperty("left");
    body.style.removeProperty("top");
    root.style.setProperty("overflow", "hidden", "important");
    body.style.setProperty("overflow", "visible", "important");
    exposeScrollableContent();
    window.requestAnimationFrame(function () {
      var width = Math.max(body.scrollWidth, body.offsetWidth, root.scrollWidth, root.clientWidth);
      var height = Math.max(body.scrollHeight, body.offsetHeight, root.scrollHeight, root.clientHeight);
      var scale = Math.min(window.innerWidth / width, window.innerHeight / height);
      body.style.margin = "0";
      body.style.transformOrigin = "top left";
      body.style.width = width + "px";
      body.style.height = height + "px";
      body.style.position = "absolute";
      body.style.left = Math.max(0, (window.innerWidth - width * scale) / 2) + "px";
      body.style.top = Math.max(0, (window.innerHeight - height * scale) / 2) + "px";
      body.style.transform = "scale(" + scale + ")";
      var autoButton = body.querySelector("#auto");
      if (autoButton && !autoButton.dataset.pptxAutoplayStarted) {
        autoButton.dataset.pptxAutoplayStarted = "true";
        autoButton.click();
      }
    });
  }
  if (document.readyState === "complete") fitAnimation();
  else window.addEventListener("load", fitAnimation, { once: true });
  window.addEventListener("resize", fitAnimation);
}());
</script>
