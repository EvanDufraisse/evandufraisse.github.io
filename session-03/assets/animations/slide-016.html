<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive feature-to-animal layers</title>
<style>
:root{--ink:#202020;--muted:#6d6d6d;--line:#cdd3dc;--blue:#276ef1;--red:#9b2424;--green:#91db63;--green-line:#5ea838;--orange:#f6b36b;--orange-line:#dd9345;--activation:#b9deed;--activation-line:#6db2cf;--positive:#5682dc;--negative:#ef8f5f}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1640px;margin:0 auto;padding:12px;overflow-x:auto}.stage{position:relative;width:1600px;height:900px;margin:auto}.stage>svg{display:block;width:1600px;height:900px}.selector{position:absolute;top:22px;right:36px;z-index:5;display:flex;align-items:center;gap:7px}.selector-label{font-size:13px;color:var(--muted);margin-right:4px}.selector button{padding:8px 13px;border:1px solid #c9cdd4;border-radius:9px;background:#fff;color:var(--ink);font-size:14px;font-weight:700;cursor:pointer}.selector button:hover{background:#f4f6f8}.selector button.is-selected{background:var(--blue);border-color:var(--blue);color:#fff}.animal-picture{opacity:0;transition:opacity .22s ease}.animal-picture.is-visible{opacity:1}.dynamic-circle,.dynamic-card{transition:fill .12s,stroke .12s,stroke-width .12s}.pulse{animation:pulse .42s ease-out}@keyframes pulse{0%{filter:drop-shadow(0 0 0 rgba(39,110,241,0))}45%{filter:drop-shadow(0 0 7px rgba(39,110,241,.55))}100%{filter:drop-shadow(0 0 0 rgba(39,110,241,0))}}@media(prefers-reduced-motion:reduce){.animal-picture{transition:none}.pulse{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="selector" aria-label="Select the input animal"><span class="selector-label">Input animal</span><button type="button" data-animal="zebra">Zebra</button><button type="button" data-animal="horse">Horse</button><button type="button" data-animal="tiger">Tiger</button><button type="button" data-animal="cat">Cat</button></div>
    <svg viewBox="0 0 1600 900" role="img" aria-labelledby="diagram-title diagram-desc">
      <title id="diagram-title">Interactive feature detectors and animal detectors</title>
      <desc id="diagram-desc">Select a zebra, horse, tiger, or cat. The image feeds three sigmoid detectors for stripes, hooves, and paws. Their continuous probability vector feeds four animal detectors, and the most probable animal becomes the prediction.</desc>
      <defs>
        <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity=".09"/></filter>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8Z" fill="#252525"/></marker>
        <clipPath id="zebra-body-clip"><ellipse cx="139" cy="392" rx="69" ry="43"/></clipPath>
        <clipPath id="tiger-body-clip"><ellipse cx="139" cy="392" rx="69" ry="43"/></clipPath>
        <style>
          text{font-family:Arial,Helvetica,sans-serif;fill:#202020}.heading{font-size:31px;font-weight:700}.subtitle{font-size:17px;fill:#666}.layer-title{font-size:18px;font-weight:700;fill:#9b2424}.small{font-size:11px;fill:#707070}.tiny{font-size:9px;fill:#707070}.label{font-size:15px;font-weight:700}.prob{font-size:15px;font-weight:700}.math{font-family:Georgia,'Times New Roman',serif}.module{fill:#fff;stroke:#d8dce3;stroke-width:1.3}.layer-box{fill:#fafbfc;stroke:#cdd3dc;stroke-width:1.6}.sum{fill:#f6b36b;stroke:#dd9345;stroke-width:1.4}.activation{fill:#b9deed;stroke:#6db2cf;stroke-width:1.4}.output{fill:#eef7e9;stroke:#80bd5d;stroke-width:1.4}.wire{fill:none;stroke:#aeb7c3;stroke-width:1.6}.wire-strong{fill:none;stroke:#252525;stroke-width:2.2}.positive{fill:#5682dc;stroke:#3f68bd}.positive-soft{fill:#9bbaf4;stroke:#7398df}.negative{fill:#ef8f5f;stroke:#d86e3e}.negative-soft{fill:#fac298;stroke:#e59d68}.transparent-card{fill:none;stroke:#d8dce3;stroke-width:1.3}
        </style>
        <symbol id="feature-body" viewBox="0 0 465 150">
          <rect class="module" x="0" y="0" width="465" height="150" rx="15"/><text x="18" y="22" class="small">WEIGHTS</text><text x="118" y="22" class="small">SUM + BIAS</text><text x="224" y="22" class="small">ACTIVATION</text><text x="334" y="22" class="small">OUTPUT</text>
          <path d="M91 84h18" class="wire-strong" marker-end="url(#arrow)"/><circle class="sum" cx="145" cy="84" r="31"/><text x="145" y="83" class="math" font-size="29" text-anchor="middle">Σ</text><text x="145" y="102" class="tiny" text-anchor="middle">+ bias</text><path d="M176 84h20" class="wire-strong" marker-end="url(#arrow)"/>
          <rect class="activation" x="205" y="57" width="95" height="54" rx="10"/><text x="252.5" y="80" class="math" font-size="16" text-anchor="middle">sigmoid</text><text x="252.5" y="99" class="small" text-anchor="middle">σ(z)</text><path d="M300 84h18" class="wire-strong" marker-end="url(#arrow)"/><circle class="output" cx="350" cy="84" r="28"/>
        </symbol>
        <symbol id="animal-body" viewBox="0 0 520 118">
          <rect class="module" x="0" y="0" width="520" height="118" rx="14"/><text x="13" y="20" class="tiny">FEATURE INPUTS</text><text x="124" y="20" class="tiny">SUM + BIAS</text><text x="226" y="20" class="tiny">ACTIVATION</text><text x="336" y="20" class="tiny">OUTPUT</text>
          <path d="M51 39h31v21h32M51 64h31M51 89h31V60" class="wire"/><path d="M82 60h32" class="wire-strong" marker-end="url(#arrow)"/><circle class="sum" cx="145" cy="60" r="28"/><text x="145" y="61" class="math" font-size="25" text-anchor="middle">Σ</text><text x="145" y="78" class="tiny" text-anchor="middle">+ bias</text><path d="M173 60h20" class="wire-strong" marker-end="url(#arrow)"/>
          <rect class="activation" x="202" y="35" width="91" height="50" rx="10"/><text x="247.5" y="56" class="math" font-size="15" text-anchor="middle">sigmoid</text><text x="247.5" y="74" class="tiny" text-anchor="middle">σ(z)</text><path d="M293 60h18" class="wire-strong" marker-end="url(#arrow)"/><circle class="output" cx="343" cy="60" r="27"/>
        </symbol>
      </defs>

      <rect width="1600" height="900" fill="#fff"/><text x="48" y="54" class="heading">Deeper layers combine simpler detections</text><text x="48" y="82" class="subtitle">Probabilistic feature detections become the inputs of the next layer.</text>

<script>
(function(){
"use strict";
const featureKeys=["s","h","p"],animalKeys=["zebra","horse","tiger","cat"];
const data={zebra:[0.96,0.94,0.06],horse:[0.07,0.95,0.05],tiger:[0.93,0.04,0.96],cat:[0.08,0.05,0.94]};
const models={zebra:{w:[10,10,-10],b:-15},horse:{w:[-10,10,-10],b:-5},tiger:{w:[10,-10,10],b:-15},cat:{w:[-10,-10,10],b:-5}};
let current=data.zebra.slice(),animationToken=0;
function sigmoid(z){return z>=0?1/(1+Math.exp(-z)):Math.exp(z)/(1+Math.exp(z));}
function animalProbabilities(features){return animalKeys.map(function(name){const model=models[name];return sigmoid(model.b+model.w.reduce(function(sum,w,i){return sum+w*features[i];},0));});}
function colorForProbability(p){const a=[238,247,233],b=[145,219,99],mix=Math.max(0,Math.min(1,p));return "rgb("+a.map(function(v,i){return Math.round(v+(b[i]-v)*mix);}).join(",")+")";}
function render(features){
  const probs=animalProbabilities(features);let winner=0;for(let i=1;i<probs.length;i++)if(probs[i]>probs[winner])winner=i;
  featureKeys.forEach(function(key,i){const p=features[i],pct=Math.round(p*100),circle=document.getElementById("feature-circle-"+key);circle.setAttribute("fill",colorForProbability(p));circle.setAttribute("stroke",p>=0.5?"#5ea838":"#80bd5d");document.getElementById("feature-text-"+key).textContent=pct+"%";document.getElementById("feature-state-"+key).textContent=p>=0.5?"activated":"not activated";document.getElementById("vector-bar-"+key).setAttribute("width",String(Math.max(2,60*p)));document.getElementById("vector-text-"+key).textContent=key.toUpperCase()+" "+pct+"%";});
  animalKeys.forEach(function(name,i){const p=probs[i],pct=Math.round(p*100),circle=document.getElementById("animal-circle-"+name),card=document.getElementById("animal-card-"+name);circle.setAttribute("fill",colorForProbability(p));circle.setAttribute("stroke",p>=0.5?"#5ea838":"#80bd5d");document.getElementById("animal-text-"+name).textContent=pct+"%";document.getElementById("animal-state-"+name).textContent=p>=0.5?"activated":"not activated";card.setAttribute("stroke",i===winner?"#b74343":"#d8dce3");card.setAttribute("stroke-width",i===winner?"2.2":"1.3");});
  document.getElementById("prediction-text").textContent=animalKeys[winner].toUpperCase();
}
function selectAnimal(name){
  animationToken+=1;const token=animationToken,start=current.slice(),target=data[name],duration=window.matchMedia("(prefers-reduced-motion: reduce)").matches?0:600,startTime=performance.now();
  document.querySelectorAll(".selector button").forEach(function(button){const selected=button.dataset.animal===name;button.classList.toggle("is-selected",selected);button.setAttribute("aria-pressed",String(selected));});
  document.querySelectorAll(".animal-picture").forEach(function(group){group.classList.toggle("is-visible",group.id==="picture-"+name);});document.getElementById("input-name").textContent=name.charAt(0).toUpperCase()+name.slice(1);
  document.querySelectorAll(".dynamic-circle").forEach(function(node){node.classList.remove("pulse");void node.getBoundingClientRect();node.classList.add("pulse");});
  function frame(now){if(token!==animationToken)return;const raw=duration===0?1:Math.min(1,(now-startTime)/duration),t=1-Math.pow(1-raw,3);current=start.map(function(value,i){return value+(target[i]-value)*t;});render(current);if(raw<1)requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
}
document.querySelectorAll(".selector button").forEach(function(button){button.addEventListener("click",function(){selectAnimal(button.dataset.animal);});});
document.querySelector('.selector button[data-animal="zebra"]').classList.add("is-selected");document.querySelector('.selector button[data-animal="zebra"]').setAttribute("aria-pressed","true");render(current);
})();
</script>
<script id="pptx-animation-fit">
(function () {
  "use strict";
  var body = document.body;
  var root = document.documentElement;
  function exposeScrollableContent() {
    Array.prototype.forEach.call(document.querySelectorAll("body *"), function (element) {
      if (element.scrollWidth > element.clientWidth + 1 ||
          element.scrollHeight > element.clientHeight + 1) {
        element.style.setProperty("overflow", "visible", "important");
        element.style.setProperty("overflow-x", "visible", "important");
        element.style.setProperty("overflow-y", "visible", "important");
      }
    });
  }
  function fitAnimation() {
    body.style.transform = "none";
    body.style.removeProperty("width");
    body.style.removeProperty("height");
    body.style.removeProperty("position");
    body.style.removeProperty("left");
    body.style.removeProperty("top");
    root.style.setProperty("overflow", "hidden", "important");
    body.style.setProperty("overflow", "visible", "important");
    exposeScrollableContent();
    window.requestAnimationFrame(function () {
      var width = Math.max(body.scrollWidth, body.offsetWidth, root.scrollWidth, root.clientWidth);
      var height = Math.max(body.scrollHeight, body.offsetHeight, root.scrollHeight, root.clientHeight);
      var scale = Math.min(window.innerWidth / width, window.innerHeight / height);
      body.style.margin = "0";
      body.style.transformOrigin = "top left";
      body.style.width = width + "px";
      body.style.height = height + "px";
      body.style.position = "absolute";
      body.style.left = Math.max(0, (window.innerWidth - width * scale) / 2) + "px";
      body.style.top = Math.max(0, (window.innerHeight - height * scale) / 2) + "px";
      body.style.transform = "scale(" + scale + ")";
      var autoButton = body.querySelector("#auto");
      if (autoButton && !autoButton.dataset.pptxAutoplayStarted) {
