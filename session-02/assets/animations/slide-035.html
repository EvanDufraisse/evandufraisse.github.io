<div id="tree-fit-error-lab" class="tree-fit-lab">
  <div class="tree-fit-chart-wrap">
    <svg class="tree-fit-chart" viewBox="0 0 760 430" role="img" aria-labelledby="tree-fit-title tree-fit-desc">
      <title id="tree-fit-title">Tree height observations and an adjustable linear model</title>
      <desc id="tree-fit-desc">Move the slope and intercept sliders. Vertical red segments show the absolute prediction errors, whose lengths are added in the bar below.</desc>
      <defs>
        <clipPath id="tree-fit-plot-clip"><rect x="62" y="20" width="678" height="350"></rect></clipPath>
      </defs>
      <g class="tree-fit-grid" aria-hidden="true"></g>
      <g class="tree-fit-axes" aria-hidden="true"></g>
      <g class="tree-fit-plot" clip-path="url(#tree-fit-plot-clip)">
        <g class="tree-fit-residuals"></g>
        <line class="tree-fit-model-line"></line>
        <g class="tree-fit-points"></g>
      </g>
      <text class="tree-fit-x-label" x="401" y="423" text-anchor="middle">Stem diameter</text>
      <text class="tree-fit-y-label" x="16" y="195" text-anchor="middle" transform="rotate(-90 16 195)">Height</text>
    </svg>
  </div>

  <div class="viz-controls tree-fit-controls" aria-label="Linear model parameters">
    <label class="form-label" for="tree-fit-a">
      <span class="tree-fit-control-heading"><span>Slope <em>a</em></span><output id="tree-fit-a-value" for="tree-fit-a">0.40</output></span>
      <input id="tree-fit-a" class="form-range" type="range" min="0" max="0.8" step="0.01" value="0.40">
    </label>
    <label class="form-label" for="tree-fit-b">
      <span class="tree-fit-control-heading"><span>Intercept <em>b</em></span><output id="tree-fit-b-value" for="tree-fit-b">7.00</output></span>
      <input id="tree-fit-b" class="form-range" type="range" min="-5" max="20" step="0.01" value="7.00">
    </label>
  </div>

  <div class="tree-fit-error-row" aria-live="polite">
    <div class="tree-fit-error-track" aria-hidden="true"><div class="tree-fit-error-fill"></div></div>
    <div class="tree-fit-error-total"><span>Average error</span><output id="tree-fit-error-value">0.0</output></div>
  </div>
  <div class="tree-fit-action-row">
    <label class="tree-fit-fast-mode" for="tree-fit-fast-mode"><input id="tree-fit-fast-mode" type="checkbox"> Fast mode (10×)</label>
    <button id="tree-fit-auto-learn" class="tree-fit-auto-learn" type="button">auto-learn</button>
  </div>
</div>

    const y = sy(tick);
    make("line", { x1: plot.left, y1: y, x2: plot.left + plot.width, y2: y }, grid);
    make("line", { x1: plot.left - 5, y1: y, x2: plot.left, y2: y }, axes);
    const label = make("text", { x: plot.left - 11, y: y + 4, "text-anchor": "end" }, axes);
    label.textContent = String(tick);
  });
  make("line", { x1: plot.left, y1: plot.top + plot.height, x2: plot.left + plot.width, y2: plot.top + plot.height }, axes);
  make("line", { x1: plot.left, y1: plot.top, x2: plot.left, y2: plot.top + plot.height }, axes);

  const residualGroup = root.querySelector(".tree-fit-residuals");
  const pointGroup = root.querySelector(".tree-fit-points");
  const residuals = data.map(([diameter, height], index) => {
    const line = make("line", { x1: sx(diameter), x2: sx(diameter), y1: sy(height), y2: sy(height) }, residualGroup);
    const point = make("circle", { cx: sx(diameter), cy: sy(height), r: 3.2 }, pointGroup);
    point.setAttribute("aria-label", "Tree " + (index + 1) + ": diameter " + diameter + ", height " + height);
    return line;
  });

  const modelLine = root.querySelector(".tree-fit-model-line");
  const aInput = root.querySelector("#tree-fit-a");
  const bInput = root.querySelector("#tree-fit-b");
  const aValue = root.querySelector("#tree-fit-a-value");
  const bValue = root.querySelector("#tree-fit-b-value");
  const errorValue = root.querySelector("#tree-fit-error-value");
  const errorFill = root.querySelector(".tree-fit-error-fill");
  const autoLearnButton = root.querySelector("#tree-fit-auto-learn");
  const fastModeInput = root.querySelector("#tree-fit-fast-mode");

  const totalError = (a, b) => data.reduce((sum, [x, y]) => sum + Math.abs(y - (a * x + b)), 0);
  const aBounds = [Number(aInput.min), Number(aInput.max)];
  const bBounds = [Number(bInput.min), Number(bInput.max)];
  const errorMax = Math.max(
    totalError(aBounds[0], bBounds[0]), totalError(aBounds[0], bBounds[1]),
    totalError(aBounds[1], bBounds[0]), totalError(aBounds[1], bBounds[1])
  );

  const update = () => {
    const a = Number(aInput.value);
    const b = Number(bInput.value);
    let sum = 0;

    data.forEach(([diameter, height], index) => {
      const prediction = a * diameter + b;
      residuals[index].setAttribute("y1", sy(height));
      residuals[index].setAttribute("y2", sy(prediction));
      sum += Math.abs(height - prediction);
    });

    modelLine.setAttribute("x1", sx(domain.xMin));
    modelLine.setAttribute("y1", sy(a * domain.xMin + b));
    modelLine.setAttribute("x2", sx(domain.xMax));
    modelLine.setAttribute("y2", sy(a * domain.xMax + b));
    aValue.value = a.toFixed(2);
    aValue.textContent = a.toFixed(2);
    bValue.value = b.toFixed(2);
    bValue.textContent = b.toFixed(2);
    const averageError = sum / data.length;
    errorValue.value = averageError.toFixed(1);
    errorValue.textContent = averageError.toFixed(1);
    errorFill.style.width = Math.min(100, sum / errorMax * 100).toFixed(2) + "%";
  };

  aInput.addEventListener("input", update);
  bInput.addEventListener("input", update);
  const step = 0.01;
  const pause = milliseconds => new Promise(resolve => window.setTimeout(resolve, fastModeInput.checked ? milliseconds / 10 : milliseconds));
  const clamp = (value, minimum, maximum) => Math.max(minimum, Math.min(maximum, value));
  const setParameters = (a, b) => {
    aInput.value = clamp(a, aBounds[0], aBounds[1]).toFixed(2);
    bInput.value = clamp(b, bBounds[0], bBounds[1]).toFixed(2);
    update();
  };
  const probe = async (a, b, delay) => {
    setParameters(a, b);
    await pause(delay);
  };

  const optimize = async () => {
    if (autoLearnButton.disabled) return;

    autoLearnButton.disabled = true;
    autoLearnButton.textContent = "optimizing";
    aInput.disabled = true;
    bInput.disabled = true;

    try {
      let iterations = 0;
      while (iterations < 5000) {
        iterations += 1;
        const baseA = Number(aInput.value);
        const baseB = Number(bInput.value);
        const baseError = totalError(baseA, baseB);
        const delay = iterations <= 40 ? 65 : iterations <= 160 ? 28 : 12;

        const aPlus = clamp(baseA + step, aBounds[0], aBounds[1]);
        const aMinus = clamp(baseA - step, aBounds[0], aBounds[1]);
        let aPlusError = Infinity;
        let aMinusError = Infinity;

        if (aPlus !== baseA) {
          await probe(aPlus, baseB, delay);
          aPlusError = totalError(aPlus, baseB);
          await probe(baseA, baseB, delay);
        }
        if (aMinus !== baseA) {
          await probe(aMinus, baseB, delay);
          aMinusError = totalError(aMinus, baseB);
          await probe(baseA, baseB, delay);
        }

        const bPlus = clamp(baseB + step, bBounds[0], bBounds[1]);
        const bMinus = clamp(baseB - step, bBounds[0], bBounds[1]);
        let bPlusError = Infinity;
        let bMinusError = Infinity;

        if (bPlus !== baseB) {
          await probe(baseA, bPlus, delay);
          bPlusError = totalError(baseA, bPlus);
          await probe(baseA, baseB, delay);
        }
        if (bMinus !== baseB) {
          await probe(baseA, bMinus, delay);
          bMinusError = totalError(baseA, bMinus);
          await probe(baseA, baseB, delay);
        }

        const aDirection = Math.min(aPlusError, aMinusError) < baseError
          ? (aPlusError <= aMinusError ? 1 : -1)
          : 0;
        const bDirection = Math.min(bPlusError, bMinusError) < baseError
          ? (bPlusError <= bMinusError ? 1 : -1)
          : 0;
        const nextA = clamp(baseA + aDirection * step, aBounds[0], aBounds[1]);
        const nextB = clamp(baseB + bDirection * step, bBounds[0], bBounds[1]);
        const nextError = totalError(nextA, nextB);

        if ((aDirection === 0 && bDirection === 0) || nextError >= baseError - 1e-9) {
          setParameters(baseA, baseB);
          break;
        }

        await probe(nextA, nextB, Math.max(delay, 35));
      }
    } finally {
      aInput.disabled = false;
      bInput.disabled = false;
      autoLearnButton.disabled = false;
      autoLearnButton.textContent = "auto-learn";
    }
  };

  autoLearnButton.addEventListener("click", optimize);
  update();
})();
</script>

<script id="pptx-animation-fit">
(function () {
  "use strict";
  var body = document.body;
  var root = document.documentElement;
  function exposeScrollableContent() {
    Array.prototype.forEach.call(document.querySelectorAll("body *"), function (element) {
      if (element.scrollWidth > element.clientWidth + 1 ||
          element.scrollHeight > element.clientHeight + 1) {
        element.style.setProperty("overflow", "visible", "important");
        element.style.setProperty("overflow-x", "visible", "important");
        element.style.setProperty("overflow-y", "visible", "important");
      }
    });
  }
  function fitAnimation() {
    body.style.transform = "none";
    body.style.removeProperty("width");
    body.style.removeProperty("height");
    body.style.removeProperty("position");
    body.style.removeProperty("left");
    body.style.removeProperty("top");
    root.style.setProperty("overflow", "hidden", "important");
    body.style.setProperty("overflow", "visible", "important");
    exposeScrollableContent();
    window.requestAnimationFrame(function () {
      var width = Math.max(body.scrollWidth, body.offsetWidth, root.scrollWidth, root.clientWidth);
      var height = Math.max(body.scrollHeight, body.offsetHeight, root.scrollHeight, root.clientHeight);
      var scale = Math.min(window.innerWidth / width, window.innerHeight / height);
      body.style.margin = "0";
      body.style.transformOrigin = "top left";
      body.style.width = width + "px";
      body.style.height = height + "px";
      body.style.position = "absolute";
      body.style.left = Math.max(0, (window.innerWidth - width * scale) / 2) + "px";
      body.style.top = Math.max(0, (window.innerHeight - height * scale) / 2) + "px";
      body.style.transform = "scale(" + scale + ")";
      var autoButton = body.querySelector("#auto");
      if (autoButton && !autoButton.dataset.pptxAutoplayStarted) {
        autoButton.dataset.pptxAutoplayStarted = "true";
        autoButton.click();
      }
    });
  }
  if (document.readyState === "complete") fitAnimation();
  else window.addEventListener("load", fitAnimation, { once: true });
  window.addEventListener("resize", fitAnimation);
}());
</script>
</body>
