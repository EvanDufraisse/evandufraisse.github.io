<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Validation compares candidate models</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #687388;
      --grid: #e3e7ee;
      --plot: #fbfcfe;
      --blue: #2e6fd8;
      --orange: #f2a65a;
      --light-orange: #fbd8b4;
      --border: #d7dce5;
      --control: #f4f6fa;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: Inter, Aptos, "Segoe UI", Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .app {
      width: min(1240px, 100vw);
      height: min(800px, 100vh);
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      background: #fff;
    }

    .visual {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 0 12px;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 690px;
    }

    text { user-select: none; }

    .title {
      fill: var(--ink);
      font-size: 29px;
      font-weight: 780;
      letter-spacing: -0.55px;
    }

    .subtitle {
      fill: var(--muted);
      font-size: 15px;
      font-weight: 460;
    }

    .eyebrow {
      fill: var(--blue);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.25px;
    }

    .iteration {
      fill: var(--ink);
      font-size: 42px;
      font-weight: 790;
      letter-spacing: -1.3px;
    }

    .iteration-total {
      fill: var(--muted);
      font-size: 15px;
      font-weight: 650;
    }

    .badge-label {
      fill: var(--muted);
      font-size: 11px;
      font-weight: 680;
      letter-spacing: 0.25px;
    }

    .badge-value {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 760;
    }

    .test-error-value {
      fill: #d77d1d;
      transition: fill 180ms ease;
    }

    .test-error-value.revealed {
      fill: #d77d1d;
    }

    .test-error-badge { cursor: pointer; }
    .test-error-badge rect { transition: fill 150ms ease, stroke 150ms ease; }
    .test-error-badge:hover rect { fill: #fff3e4; stroke: #f2a65a; }
    .test-error-badge:focus { outline: none; }
    .test-error-badge:focus rect { stroke: #2e6fd8; stroke-width: 2; }

    .legend-label {
      fill: #526078;
      font-size: 13px;
      font-weight: 650;
    }

    .tick {
      fill: #687388;
      font-size: 12px;
      font-weight: 500;
    }

    .axis-label {
      fill: #263147;
      font-size: 15px;
      font-weight: 730;
    }

    .prediction {
      fill: none;
      stroke: var(--blue);
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .train-point {
      fill: var(--ink);
      stroke: #fff;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .test-point {
      fill: var(--light-orange);
      stroke: var(--orange);
      stroke-width: 1.15;
      opacity: 0.25;
      vector-effect: non-scaling-stroke;
      transition: opacity 220ms ease;
    }

    .test-point.hidden { opacity: 0; }

    .footer-message {
      fill: #526078;
      font-size: 13.5px;
      font-weight: 620;
    }

    .controls {
      border-top: 1px solid #e6e9f0;
      padding: 11px 16px 14px;
      display: grid;
      grid-template-columns: auto minmax(320px, 1fr) auto;
      align-items: center;
      gap: 18px;
      background: rgba(255, 255, 255, 0.98);
    }

    .button-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    button {
      border: 1px solid #dbe0e8;
      background: var(--control);
      color: #263147;
      min-height: 38px;
      padding: 7px 12px;
      border-radius: 10px;
      font: inherit;
      font-size: 13px;
      font-weight: 690;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease, transform 100ms ease;
    }

    button:hover { background: #e9edf5; border-color: #c9d0dc; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.38; cursor: default; transform: none; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(46, 111, 216, 0.28);
      outline-offset: 2px;
    }

    .primary {
      min-width: 86px;
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    .primary:hover { background: #263147; border-color: #263147; }

    .timeline {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 5px;
      min-width: 0;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .timeline-labels {
      display: flex;
      justify-content: space-between;
      color: #8a93a3;
      font-size: 10.5px;
      font-weight: 600;
    }

    .utility {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
    }

    .shortcut {
      color: #8a93a3;
      font-size: 10.5px;
      line-height: 1.25;
      text-align: right;
      white-space: nowrap;
    }

    @media (max-width: 800px) {
      .controls { grid-template-columns: 1fr; gap: 9px; }
      .button-row, .utility { justify-content: center; }
      .timeline { order: -1; }
      .shortcut { display: none; }
    }

    @media (max-width: 1100px) {
      .shortcut { display: none; }
      .controls { gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .test-point { transition: none; }
    }

    .validation-point {
      fill: var(--light-orange);
      stroke: var(--orange);
      stroke-width: 1.15;
      vector-effect: non-scaling-stroke;
    }
    .test-point {
      fill: #eef1f5;
      stroke: #a7b1c0;
      opacity: 0.22;
    }
    #validationCard.best rect { stroke: #f2a65a; stroke-width: 2.5; fill: #fff4e6; }
    #testScore { fill: #d77d1d; font-weight: 760; }
  </style>
</head>
<body>
  <main class="app">
    <section class="visual" aria-label="Interactive neural-network training checkpoints">
      <svg id="chart" viewBox="0 0 1000 660" role="img" aria-labelledby="chartTitle chartDescription">
        <title id="chartTitle">Validation compares candidate models</title>
        <desc id="chartDescription">A neural network is shown at twenty training checkpoints. Sixty-four observations train the model, sixteen validate the checkpoints, and twenty test observations remain unused.</desc>

        <text class="title" x="64" y="55">Validation compares candidate models</text>
        <text class="subtitle" x="64" y="82">64 observations train the network; 16 observations compare its successive checkpoints</text>

        <text class="eyebrow" x="936" y="34" text-anchor="end">TRAINING ITERATION</text>

        <g transform="translate(64 105)">

          <text class="badge-label" x="13" y="17">SAVED CHECKPOINT</text>
          <text id="candidate" class="badge-value" x="13" y="36">Candidate 1 of 20</text>

        <g transform="translate(338 105)">

        <g id="validationCard" transform="translate(512 105)">

          <text class="badge-label" x="13" y="17">VALIDATION AVG ERROR</text>

        </g>

        <g id="legend" transform="translate(640 159)">

          <text class="legend-label" x="292" y="0">Test (20)</text>
        </g>

        <rect x="84" y="166" width="852" height="414" fill="#fbfcfe" stroke="#d7dce5" stroke-width="1"></rect>

        <g stroke="#e3e7ee" stroke-width="1">
          <line x1="113.4" y1="166" x2="113.4" y2="580"></line>
          <line x1="260.3" y1="166" x2="260.3" y2="580"></line>
          <line x1="407.2" y1="166" x2="407.2" y2="580"></line>
          <line x1="554.1" y1="166" x2="554.1" y2="580"></line>
          <line x1="701.0" y1="166" x2="701.0" y2="580"></line>
          <line x1="847.9" y1="166" x2="847.9" y2="580"></line>
          <line x1="84" y1="580" x2="936" y2="580"></line>
          <line x1="84" y1="511" x2="936" y2="511"></line>
          <line x1="84" y1="442" x2="936" y2="442"></line>
          <line x1="84" y1="373" x2="936" y2="373"></line>
          <line x1="84" y1="304" x2="936" y2="304"></line>
          <line x1="84" y1="235" x2="936" y2="235"></line>
          <line x1="84" y1="166" x2="936" y2="166"></line>
        </g>

        <g class="tick" text-anchor="middle">
          <text x="113.4" y="600">10</text>
          <text x="260.3" y="600">20</text>
          <text x="407.2" y="600">30</text>
          <text x="554.1" y="600">40</text>
          <text x="701.0" y="600">50</text>
          <text x="847.9" y="600">60</text>
        </g>
        <g class="tick" text-anchor="end">
          <text x="76" y="584">0</text>
          <text x="76" y="515">10</text>
          <text x="76" y="446">20</text>
          <text x="76" y="377">30</text>
          <text x="76" y="308">40</text>
          <text x="76" y="239">50</text>
          <text x="76" y="170">60</text>
        </g>

        <text class="axis-label" x="510" y="627" text-anchor="middle">Stem diameter</text>
        <text class="axis-label" x="37" y="373" text-anchor="middle" transform="rotate(-90 37 373)">Tree height</text>

        <path id="prediction" class="prediction" d=""></path>
        <g id="testPoints"></g>
        <g id="validationPoints"></g>
        <g id="trainPoints"></g>

        <text id="footerMessage" class="footer-message" x="84" y="651">Validation avg error compares the candidate models. The test score remains untouched until the final choice.</text>
        <text id="testScore" class="footer-message" x="936" y="651" text-anchor="end" fill="#d77d1d"></text>
      </svg>
    </section>

    <nav class="controls" aria-label="Animation controls">
      <div class="button-row">
        <button id="previous" type="button">Back</button>
        <button id="play" class="primary" type="button">Play</button>
        <button id="next" type="button">Next</button>
        <button id="reset" type="button">Reset</button>
        <button id="revealTest" type="button" aria-pressed="false">Reveal test avg error</button>
      </div>

      <div class="timeline">
        <input id="checkpointSlider" type="range" min="0" max="18" step="1" value="0" aria-label="Choose a saved training checkpoint">
        <div class="timeline-labels">
          <span>Untrained</span>
          <span>Broad pattern</span>
          <span>Fine detail</span>
          <span>Memorization</span>
        </div>
      </div>

      <div class="utility">
        <button id="toggleTest" type="button" aria-pressed="false">Hide test points</button>
        <div class="shortcut">Left/right: checkpoints &nbsp; T: test avg error<br>Space: play/pause &nbsp; F: fullscreen</div>
      </div>
    </nav>
  </main>

    let currentIndex = 0;
    let displayedPrediction = data.snapshots[0].prediction.slice();
    let animationFrame = null;
    let playTimer = null;
    let playing = false;
    let testHidden = false;
    let testErrorRevealed = false;

    function createCircle(point) {
      const circle = document.createElementNS(svgNS, "circle");
      circle.setAttribute("cx", xScale(point.x).toFixed(2));
      circle.setAttribute("cy", yScale(point.y).toFixed(2));
      circle.setAttribute("r", point.group === "train" ? "3.45" : "4.1");
      circle.classList.add(`${point.group}-point`);
      if (point.group === "train") trainLayer.appendChild(circle);
      else if (point.group === "validation") validationLayer.appendChild(circle);
      else testLayer.appendChild(circle);
      return circle;
    }

    const testCircles = [];
    data.points.forEach(point => {
      const circle = createCircle(point);
      if (point.group === "test") testCircles.push(circle);
    });

    function makePath(values) {
      return values.map((value, index) => {
        const command = index === 0 ? "M" : "L";
        return `${command}${xScale(data.gridX[index]).toFixed(2)},${yScale(value).toFixed(2)}`;
      }).join(" ");
    }

    function formatError(value) {
      if (value < 0.0001) return "0";
      if (value >= 100) return value.toFixed(1);
      if (value >= 10) return value.toFixed(2);
      if (value >= 1) return value.toFixed(3);
      return value.toFixed(4);
    }

    function updateLabels() {
      const snapshot = data.snapshots[currentIndex];
      iterationLabel.textContent = snapshot.step.toLocaleString("en-US");
      iterationTotal.textContent = `of ${data.snapshots.at(-1).step.toLocaleString("en-US")}`;
      candidateLabel.textContent = `Candidate ${currentIndex + 1} of ${data.snapshots.length}`;
      trainingError.textContent = formatError(snapshot.trainingAvgError);
      validationError.textContent = formatError(snapshot.validationAvgError);
      validationCard.classList.toggle("best", snapshot.bestValidation);
      testScore.textContent = testErrorRevealed ? `Test avg error: ${formatError(snapshot.testAvgError)}` : "";
      revealTestButton.textContent = testErrorRevealed
        ? `Test avg error: ${formatError(snapshot.testAvgError)}`
        : "Reveal test avg error";
      slider.value = String(currentIndex);
      previousButton.disabled = currentIndex === 0;
      nextButton.disabled = currentIndex === data.snapshots.length - 1;
    }

    function stopCurveAnimation() {
      if (animationFrame !== null) cancelAnimationFrame(animationFrame);
      animationFrame = null;
    }

    function showCheckpoint(index, animate = true) {
      currentIndex = Math.max(0, Math.min(data.snapshots.length - 1, index));
      const target = data.snapshots[currentIndex].prediction;
      updateLabels();
      stopCurveAnimation();

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!animate || reduceMotion) {
        displayedPrediction = target.slice();
        predictionPath.setAttribute("d", makePath(displayedPrediction));
        return;
      }
      const start = displayedPrediction.slice();
      const startTime = performance.now();
      const duration = 520;
      const ease = value => 1 - Math.pow(1 - value, 3);
      function frame(now) {
        const progress = Math.min(1, (now - startTime) / duration);
        const eased = ease(progress);
        displayedPrediction = start.map((value, i) => value + (target[i] - value) * eased);
        predictionPath.setAttribute("d", makePath(displayedPrediction));
        if (progress < 1) animationFrame = requestAnimationFrame(frame);
        else animationFrame = null;
      }
      animationFrame = requestAnimationFrame(frame);
    }

    function stopPlayback() {
      playing = false;
      clearTimeout(playTimer);
      playTimer = null;
      playButton.textContent = "Play";
    }

    function schedulePlayback() {
      if (!playing) return;
      playTimer = window.setTimeout(() => {
        if (currentIndex >= data.snapshots.length - 1) {
          stopPlayback();
          return;
        }
        showCheckpoint(currentIndex + 1, true);
        schedulePlayback();
      }, 1150);
    }

    function togglePlayback() {
      if (playing) {
        stopPlayback();
        return;
      }
      if (currentIndex >= data.snapshots.length - 1) showCheckpoint(0, false);
      playing = true;
      playButton.textContent = "Pause";
      showCheckpoint(currentIndex + 1, true);
      schedulePlayback();
    }

    function setTestErrorReveal(revealed) {
      testErrorRevealed = revealed;
      revealTestButton.setAttribute("aria-pressed", String(revealed));
      footerMessage.textContent = revealed
        ? "Checkpoint selected with validation data; the test score is now used once for final evaluation."
        : "Validation avg error compares the candidate models. The test score remains untouched until the final choice.";
      updateLabels();
    }

    previousButton.addEventListener("click", () => { stopPlayback(); showCheckpoint(currentIndex - 1, true); });
    nextButton.addEventListener("click", () => { stopPlayback(); showCheckpoint(currentIndex + 1, true); });
    resetButton.addEventListener("click", () => { stopPlayback(); showCheckpoint(0, false); setTestErrorReveal(false); });
    playButton.addEventListener("click", togglePlayback);
    slider.addEventListener("input", () => { stopPlayback(); showCheckpoint(Number(slider.value), false); });
    revealTestButton.addEventListener("click", () => setTestErrorReveal(!testErrorRevealed));
    toggleTestButton.addEventListener("click", () => {
      testHidden = !testHidden;
      testCircles.forEach(circle => circle.classList.toggle("hidden", testHidden));
      toggleTestButton.textContent = testHidden ? "Show test points" : "Hide test points";
      toggleTestButton.setAttribute("aria-pressed", String(testHidden));
    });

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowRight") { event.preventDefault(); stopPlayback(); showCheckpoint(currentIndex + 1, true); }
      else if (event.key === "ArrowLeft") { event.preventDefault(); stopPlayback(); showCheckpoint(currentIndex - 1, true); }
      else if (event.code === "Space") { event.preventDefault(); togglePlayback(); }
      else if (event.key.toLowerCase() === "r") { stopPlayback(); showCheckpoint(0, false); setTestErrorReveal(false); }
      else if (event.key.toLowerCase() === "t") { setTestErrorReveal(!testErrorRevealed); }
      else if (event.key.toLowerCase() === "f") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      }
    });

    predictionPath.setAttribute("d", makePath(displayedPrediction));
    slider.max = String(data.snapshots.length - 1);
    updateLabels();
  </script>
<script id="pptx-animation-fit">
(function () {
  "use strict";
  var body = document.body;
  var root = document.documentElement;
  function exposeScrollableContent() {
    Array.prototype.forEach.call(document.querySelectorAll("body *"), function (element) {
      if (element.scrollWidth > element.clientWidth + 1 ||
          element.scrollHeight > element.clientHeight + 1) {
        element.style.setProperty("overflow", "visible", "important");
        element.style.setProperty("overflow-x", "visible", "important");
        element.style.setProperty("overflow-y", "visible", "important");
      }
    });
  }
  function fitAnimation() {
    body.style.transform = "none";
    body.style.removeProperty("width");
    body.style.removeProperty("height");
    body.style.removeProperty("position");
    body.style.removeProperty("left");
    body.style.removeProperty("top");
    root.style.setProperty("overflow", "hidden", "important");
    body.style.setProperty("overflow", "visible", "important");
    exposeScrollableContent();
    window.requestAnimationFrame(function () {
      var width = Math.max(body.scrollWidth, body.offsetWidth, root.scrollWidth, root.clientWidth);
      var height = Math.max(body.scrollHeight, body.offsetHeight, root.scrollHeight, root.clientHeight);
      var scale = Math.min(window.innerWidth / width, window.innerHeight / height);
      body.style.margin = "0";
      body.style.transformOrigin = "top left";
      body.style.width = width + "px";
      body.style.height = height + "px";
      body.style.position = "absolute";
      body.style.left = Math.max(0, (window.innerWidth - width * scale) / 2) + "px";
      body.style.top = Math.max(0, (window.innerHeight - height * scale) / 2) + "px";
      body.style.transform = "scale(" + scale + ")";
      var autoButton = body.querySelector("#auto");
      if (autoButton && !autoButton.dataset.pptxAutoplayStarted) {
        autoButton.dataset.pptxAutoplayStarted = "true";
        autoButton.click();
      }
    });
  }
  if (document.readyState === "complete") fitAnimation();
  else window.addEventListener("load", fitAnimation, { once: true });
  window.addEventListener("resize", fitAnimation);
}());
</script>
