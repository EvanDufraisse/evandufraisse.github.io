<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neural-network training creates candidate models</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #687388;
      --grid: #e3e7ee;
      --plot: #fbfcfe;
      --blue: #2e6fd8;
      --orange: #f2a65a;
      --light-orange: #fbd8b4;
      --border: #d7dce5;
      --control: #f4f6fa;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: Inter, Aptos, "Segoe UI", Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .app {
      width: min(1240px, 100vw);
      height: min(800px, 100vh);
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      background: #fff;
    }

    .visual {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 0 12px;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 690px;
    }

    text { user-select: none; }

    .title {
      fill: var(--ink);
      font-size: 29px;
      font-weight: 780;
      letter-spacing: -0.55px;
    }

    .subtitle {
      fill: var(--muted);
      font-size: 15px;
      font-weight: 460;
    }

    .eyebrow {
      fill: var(--blue);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.25px;
    }

    .iteration {
      fill: var(--ink);
      font-size: 42px;
      font-weight: 790;
      letter-spacing: -1.3px;
    }

    .iteration-total {
      fill: var(--muted);
      font-size: 15px;
      font-weight: 650;
    }

    .badge-label {
      fill: var(--muted);
      font-size: 11px;
      font-weight: 680;
      letter-spacing: 0.25px;
    }

    .badge-value {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 760;
    }

    .test-error-value {
      fill: #d77d1d;
      transition: fill 180ms ease;
    }

    .test-error-value.revealed {
      fill: #d77d1d;
    }

    .test-error-badge { cursor: pointer; }
    .test-error-badge rect { transition: fill 150ms ease, stroke 150ms ease; }
    .test-error-badge:hover rect { fill: #fff3e4; stroke: #f2a65a; }
    .test-error-badge:focus { outline: none; }
    .test-error-badge:focus rect { stroke: #2e6fd8; stroke-width: 2; }

    .legend-label {
      fill: #526078;
      font-size: 13px;
      font-weight: 650;
    }

    .tick {
      fill: #687388;
      font-size: 12px;
      font-weight: 500;
    }

    .axis-label {
      fill: #263147;
      font-size: 15px;
      font-weight: 730;
    }

    .prediction {
      fill: none;
      stroke: var(--blue);
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .train-point {
      fill: var(--ink);
      stroke: #fff;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .test-point {
      fill: var(--light-orange);
      stroke: var(--orange);
      stroke-width: 1.15;
      opacity: 0.25;
      vector-effect: non-scaling-stroke;
      transition: opacity 220ms ease;
    }

    .test-point.hidden { opacity: 0; }

    .footer-message {
      fill: #526078;
      font-size: 13.5px;
      font-weight: 620;
    }

    .controls {
      border-top: 1px solid #e6e9f0;
      padding: 11px 16px 14px;
      display: grid;
      grid-template-columns: auto minmax(320px, 1fr) auto;
      align-items: center;
      gap: 18px;
      background: rgba(255, 255, 255, 0.98);
    }

    .button-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    button {
      border: 1px solid #dbe0e8;
      background: var(--control);
      color: #263147;
      min-height: 38px;
      padding: 7px 12px;
      border-radius: 10px;
      font: inherit;
      font-size: 13px;
      font-weight: 690;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease, transform 100ms ease;
    }

    button:hover { background: #e9edf5; border-color: #c9d0dc; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.38; cursor: default; transform: none; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(46, 111, 216, 0.28);
      outline-offset: 2px;
    }

    .primary {
      min-width: 86px;
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    .primary:hover { background: #263147; border-color: #263147; }

    .timeline {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 5px;
      min-width: 0;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .timeline-labels {
      display: flex;
      justify-content: space-between;
      color: #8a93a3;
      font-size: 10.5px;
      font-weight: 600;
    }

    .utility {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
    }

    .shortcut {
      color: #8a93a3;
      font-size: 10.5px;
      line-height: 1.25;
      text-align: right;
      white-space: nowrap;
    }

    @media (max-width: 800px) {
      .controls { grid-template-columns: 1fr; gap: 9px; }
      .button-row, .utility { justify-content: center; }
      .timeline { order: -1; }
      .shortcut { display: none; }
    }

    @media (max-width: 1100px) {
      .shortcut { display: none; }
      .controls { gap: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .test-point { transition: none; }
    }
  </style>
</head>
<body>

    <section class="visual" aria-label="Interactive neural-network training checkpoints">

        </g>

        <rect x="84" y="166" width="852" height="414" fill="#fbfcfe" stroke="#d7dce5" stroke-width="1"></rect>

        <g stroke="#e3e7ee" stroke-width="1">
          <line x1="113.4" y1="166" x2="113.4" y2="580"></line>
          <line x1="260.3" y1="166" x2="260.3" y2="580"></line>
          <line x1="407.2" y1="166" x2="407.2" y2="580"></line>
          <line x1="554.1" y1="166" x2="554.1" y2="580"></line>
          <line x1="701.0" y1="166" x2="701.0" y2="580"></line>
          <line x1="847.9" y1="166" x2="847.9" y2="580"></line>
          <line x1="84" y1="580" x2="936" y2="580"></line>
          <line x1="84" y1="511" x2="936" y2="511"></line>
          <line x1="84" y1="442" x2="936" y2="442"></line>
          <line x1="84" y1="373" x2="936" y2="373"></line>
          <line x1="84" y1="304" x2="936" y2="304"></line>
          <line x1="84" y1="235" x2="936" y2="235"></line>
          <line x1="84" y1="166" x2="936" y2="166"></line>
        </g>

        <g class="tick" text-anchor="middle">
          <text x="113.4" y="600">10</text>
          <text x="260.3" y="600">20</text>
          <text x="407.2" y="600">30</text>
          <text x="554.1" y="600">40</text>
          <text x="701.0" y="600">50</text>
          <text x="847.9" y="600">60</text>
        </g>
        <g class="tick" text-anchor="end">
          <text x="76" y="584">0</text>
          <text x="76" y="515">10</text>
          <text x="76" y="446">20</text>
          <text x="76" y="377">30</text>
          <text x="76" y="308">40</text>
          <text x="76" y="239">50</text>
          <text x="76" y="170">60</text>
        </g>

        <text class="axis-label" x="510" y="627" text-anchor="middle">Stem diameter</text>
        <text class="axis-label" x="37" y="373" text-anchor="middle" transform="rotate(-90 37 373)">Tree height</text>

        <path id="prediction" class="prediction" d=""></path>
        <g id="testPoints"></g>
        <g id="trainPoints"></g>

        <text id="footerMessage" class="footer-message" x="84" y="651">Each checkpoint is a different candidate model. Training avg error alone cannot tell us which one will generalize best.</text>
      </svg>
    </section>

    <nav class="controls" aria-label="Animation controls">
      <div class="button-row">
        <button id="previous" type="button">Back</button>
        <button id="play" class="primary" type="button">Play</button>
        <button id="next" type="button">Next</button>
        <button id="reset" type="button">Reset</button>
        <button id="revealTest" type="button" aria-pressed="false">Reveal test avg error</button>
      </div>

      <div class="timeline">
        <input id="checkpointSlider" type="range" min="0" max="18" step="1" value="0" aria-label="Choose a saved training checkpoint">
        <div class="timeline-labels">
          <span>Untrained</span>
          <span>Broad pattern</span>
          <span>Fine detail</span>
          <span>Memorization</span>
        </div>
      </div>

      <div class="utility">
        <button id="toggleTest" type="button" aria-pressed="false">Hide test points</button>
        <div class="shortcut">Left/right: checkpoints &nbsp; T: test avg error<br>Space: play/pause &nbsp; F: fullscreen</div>
      </div>
    </nav>
  </main>
